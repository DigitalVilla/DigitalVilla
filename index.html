    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Digital Villa" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Digital Villa",
        "url": "https://www.digitalvilla.ca",
        "description": "Full-stack software engineering studio building serverless web & mobile products, trusted by Fortune 500 and global brands.",
        "email": "digitalvilla01@gmail.com",
        "telephone": "+1-587-887-8781",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Calgary",
          "addressRegion": "Alberta",
          "addressCountry": "Canada"
        }
      }
    </script>

    <!-- Prevent theme flash: apply persisted/system theme before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dv-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored || (prefersDark ? 'dark' : 'light')
          var root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.classList.toggle('light', theme === 'light')
          root.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
