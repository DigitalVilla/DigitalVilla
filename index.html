    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digital Villa — Full-Stack Software Engineering Studio" />
    <meta
      name="twitter:description"
      content="Premium serverless web & mobile products, engineered end-to-end. Trusted by Fortune 500 and global brands."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />

    <link rel="preconnect" href="https://assets.digitalvilla.ca" crossorigin />
    <!-- Fonts and logo are needed for the first paint; fetch them before the JS asks. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-latin-wght.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-wght.woff2" crossorigin />
    <link rel="preload" as="image" href="/logo_DV.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Digital Villa",
        "url": "https://www.digitalvilla.ca",
        "description": "Full-stack software engineering studio building serverless web & mobile products, trusted by Fortune 500 and global brands.",
        "email": "digitalvilla01@gmail.com",
        "telephone": "+1-587-887-8781",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Calgary",
          "addressRegion": "Alberta",
          "addressCountry": "Canada"
        }
      }
    </script>

    <!-- Prevent theme flash: apply persisted theme before paint (dark by default) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dv-theme')
          var theme = stored === 'light' ? 'light' : 'dark'
          var root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.classList.toggle('light', theme === 'light')
          root.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>

    <!-- Earlier builds shipped a service worker. Retire it so nobody is served
         a stale, cached copy of the site. (/sw.js is a matching kill switch for
         browsers that still load the old shell from cache.) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            if (!regs.length) return
            regs.forEach(function (r) {
              r.unregister()
            })
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) {
                  caches.delete(k)
                })
              })
            }
          })
          .catch(function () {})
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
